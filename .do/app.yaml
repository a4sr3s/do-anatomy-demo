# DigitalOcean App Platform spec.
# Deploy:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <APP_ID> --spec .do/app.yaml
name: do-anatomy-demo
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_ORG/do-anatomy-demo
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      # mock needs no credentials. Switch to "real" and fill the secrets below.
      - key: PIPELINE_MODE
        value: mock
      - key: REPLAY_FALLBACK
        value: "true"
      - key: MOCK_DELAY_SCALE
        value: "1"
      # ---- real mode (set type: SECRET values in the control panel or via doctl) ----
      - key: DO_SPACES_KEY
        value: ""
        type: SECRET
      - key: DO_SPACES_SECRET
        value: ""
        type: SECRET
      - key: DO_SPACES_REGION
        value: nyc3
      - key: DO_SPACES_BUCKET
        value: anatomy-demo
      - key: DATABASE_URL
        value: ""
        type: SECRET
      - key: DO_INFERENCE_URL
        value: https://inference.do-ai.run/v1
      - key: DO_INFERENCE_KEY
        value: ""
        type: SECRET
      - key: DO_INFERENCE_MODEL
        value: llama3.3-70b-instruct
      - key: DO_EMBEDDING_MODEL
        value: ""
      - key: VECTOR_DIM
        value: "128"
      - key: DO_AGENT_ENDPOINT
        value: ""
      - key: DO_AGENT_KEY
        value: ""
        type: SECRET
# Optional: attach a Managed Postgres (pgvector-capable) database and bind
# DATABASE_URL to ${db.DATABASE_URL} instead of a static secret.
# databases:
#   - name: db
#     engine: PG
#     version: "16"
#     production: false
